<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reservar Cita - Andy The Barbers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 50px;
    }
    input, select, button {
      margin: 10px;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 80%;
    }
    button {
      background: #000;
      color: white;
      cursor: pointer;
    }
    h1 {
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Reserva tu cita</h1>
  <form>
    <input type="text" placeholder="Nombre del cliente" required>
    <input type="date" required>
    <input type="time" required>

    <label for="local">Local:</label>
    <select id="local" required>
      <option value="">Selecciona un local</option>
      <option value="local1 rio cutuchi rio palora">local1</option>
      <option value="local2 pichincha manco capac">local2</option>
    </select>

    <label for="barbero">Barbero:</label>
    <select id="barbero" required>
      <option value="">Selecciona un barbero</option>
      <option value="andy">Andy</option>
      <option value="josue">Carlos</option>
      
      
    </select>

    <button type="submit">Agendar Cita</button>
  </form>
</body>
</html>
